[package]
name = "jingwei-workbench"
version = "0.1.0"
description = "Jingwei Agent native semantic workbench shell"
edition = "2021"
license = "Proprietary"

# Session 05 remains an independently testable crate until the integration
# owner registers it in the shared root workspace after sessions 02-04 merge.
[workspace]

[lib]
name = "jingwei_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
