[package]
name = "jingwei-schematic"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "JIR-compatible logical schematic graph, semantic editing and views for Jingwei"

[dependencies]
jingwei-components = { path = "../jingwei-components" }
jingwei-jdp = { path = "../jingwei-jdp" }
jingwei-jir = { path = "../jingwei-jir" }
jingwei-library = { path = "../jingwei-library" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "allow"
