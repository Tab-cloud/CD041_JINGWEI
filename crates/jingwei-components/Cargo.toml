[package]
name = "jingwei-components"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic DesignIntent and exact-MPN component selection domain for Jingwei"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "allow"
